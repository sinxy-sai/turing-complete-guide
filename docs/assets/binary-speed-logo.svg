<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Binary Speed logo</title>
  <desc id="desc">An orange binary zero above eight illuminated bit indicators.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17132f"/>
      <stop offset="1" stop-color="#30206b"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff6b35"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <path d="M48 364h416M48 404h416" stroke="#ffffff" stroke-opacity=".08" stroke-width="4"/>
  <text x="256" y="230" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="190" font-weight="800" fill="url(#orange)" filter="url(#glow)">0</text>
  <g fill="#ff9f43" stroke="#ffd08a" stroke-width="3">
    <rect x="58" y="334" width="38" height="38" rx="9"/>
    <rect x="112" y="334" width="38" height="38" rx="9"/>
    <rect x="166" y="334" width="38" height="38" rx="9"/>
    <rect x="220" y="334" width="38" height="38" rx="9"/>
    <rect x="274" y="334" width="38" height="38" rx="9"/>
    <rect x="328" y="334" width="38" height="38" rx="9"/>
    <rect x="382" y="334" width="38" height="38" rx="9"/>
    <rect x="436" y="334" width="38" height="38" rx="9"/>
  </g>
  <g fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    <text x="77" y="361">1</text><text x="131" y="361">0</text><text x="185" y="361">1</text><text x="239" y="361">0</text>
    <text x="293" y="361">1</text><text x="347" y="361">0</text><text x="401" y="361">1</text><text x="455" y="361">0</text>
  </g>
  <text x="256" y="438" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="28" letter-spacing="6" font-weight="700" fill="#ffffff">BINARY SPEED</text>
</svg>
